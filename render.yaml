services:
  - type: web
    name: ochakovo-brodilka
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: node serve.js
    healthCheckPath: /
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: brodilka-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
