  <!-- hand-drawn accents -->
  <path d="M96 88c14-14 32-18 50-10M150 96c-4 12-13 19-26 20" stroke="#FF6B3D" stroke-width="4" stroke-linecap="round"/>
  <path d="M566 260c10-10 22-13 36-8" stroke="#10251A" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
</svg>

