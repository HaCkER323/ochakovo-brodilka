      <g fill="#FFFDF5" opacity="0.55">
        <circle cx="415" cy="350" r="4"/><circle cx="430" cy="368" r="2.6"/><circle cx="566" cy="352" r="3.4"/>
        <circle cx="552" cy="370" r="2.2"/><circle cx="406" cy="640" r="3"/><circle cx="574" cy="636" r="4"/>
      </g>
      <path d="M418 320v400" stroke="#FFFFFF" stroke-width="12" opacity="0.2" stroke-linecap="round"/>
      <path d="M566 322v396" stroke="#10251A" stroke-width="9" opacity="0.16" stroke-linecap="round"/>
