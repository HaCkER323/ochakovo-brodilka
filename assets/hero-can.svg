      <text x="235" y="585" text-anchor="middle" fill="#0C3B28" font-family="Bahnschrift, Arial Narrow, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.8">ОЧАКОВО · БРОДИЛКА</text>
      <text x="235" y="599" text-anchor="middle" fill="#0C3B28" font-family="Bahnschrift, Arial Narrow, sans-serif" font-size="7.5" font-weight="600" letter-spacing="1">ТРАДИЦИОННЫЙ РЕЦЕПТ</text>
