      <rect x="390" y="376" width="210" height="10" fill="#FF6B3D"/>
      <rect x="390" y="614" width="210" height="10" fill="#FF6B3D"/>
      <text x="495" y="404" text-anchor="middle" fill="#0C3B28" font-family="Bahnschrift, Arial Narrow, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">ОЧАКОВСКИЙ</text>
      <text x="495" y="446" text-anchor="middle" fill="#0C3B28" font-family="Bahnschrift, Arial Narrow, sans-serif" font-size="37" font-weight="800" letter-spacing="-0.5">ЛИМОНАД</text>
