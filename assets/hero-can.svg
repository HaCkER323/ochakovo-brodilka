<svg width="700" height="780" viewBox="0 0 700 780" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hcBottle" x1="150" y1="400" x2="320" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08291B"/>
      <stop offset="0.16" stop-color="#176B45"/>
      <stop offset="0.42" stop-color="#2C8A5B"/>
      <stop offset="0.7" stop-color="#115132"/>
      <stop offset="1" stop-color="#072418"/>
    </linearGradient>
    <linearGradient id="hcCan" x1="390" y1="500" x2="600" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A3824"/>
      <stop offset="0.18" stop-color="#1D7A4F"/>
      <stop offset="0.5" stop-color="#2F9663"/>
      <stop offset="0.8" stop-color="#125335"/>
      <stop offset="1" stop-color="#07281A"/>
    </linearGradient>
    <linearGradient id="hcMetal" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#EAF0EA"/>
      <stop offset="0.5" stop-color="#A9B8AF"/>
      <stop offset="1" stop-color="#6E8076"/>
    </linearGradient>
    <linearGradient id="hcLabel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFCF1"/>
      <stop offset="1" stop-color="#EDE5D1"/>
    </linearGradient>
    <linearGradient id="hcLemon" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FBE07A"/>
      <stop offset="1" stop-color="#EFAE2F"/>
    </linearGradient>
    <filter id="hcShadow" x="-100" y="-100" width="900" height="980" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="hcGlow" x="-100" y="-100" width="900" height="980" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <clipPath id="hcBottleBody">
