    <circle cx="124" cy="141" r="7" fill="#FFFDF5" opacity="0.9"/>
    <circle cx="612" cy="140" r="17" fill="#F6C94C" stroke="#10251A" stroke-width="3"/>
    <circle cx="648" cy="196" r="27" fill="none" stroke="#10251A" stroke-width="3"/>
    <circle cx="76" cy="330" r="11" fill="none" stroke="#10251A" stroke-width="3"/>
    <circle cx="676" cy="420" r="8" fill="#FF6B3D" stroke="#10251A" stroke-width="2.5"/>
    <circle cx="352" cy="188" r="9" fill="none" stroke="#10251A" stroke-width="3"/>
    <circle cx="628" cy="300" r="6" fill="#F3EEDF"/>
  </g>

  <!-- rye stalk left -->
