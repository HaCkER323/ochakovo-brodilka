    <ellipse cx="495" cy="302" rx="82" ry="10" fill="#8C9C92"/>
    <path d="M470 300c6-9 20-13 32-8 6 2 8 7 5 10-4 4-14 5-24 3-10-1-16-3-13-5Z" fill="#DDE5DD" stroke="#10251A" stroke-width="3"/>
