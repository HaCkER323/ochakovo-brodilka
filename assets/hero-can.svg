      <text x="235" y="474" text-anchor="middle" fill="#0C3B28" font-family="Bahnschrift, Arial Narrow, sans-serif" font-size="40" font-weight="800" letter-spacing="-1">КВАС</text>
      <path d="M190 492h90" stroke="#0C3B28" stroke-width="3"/>
      <text x="235" y="514" text-anchor="middle" fill="#0C3B28" font-family="Bahnschrift, Arial Narrow, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">ДВОЙНОЕ БРОЖЕНИЕ</text>
      <text x="235" y="536" text-anchor="middle" fill="#0C3B28" font-family="Bahnschrift, Arial Narrow, sans-serif" font-size="9" font-weight="600" letter-spacing="0.8">РЖАНОЙ СОЛОД · 0,5 Л</text>
