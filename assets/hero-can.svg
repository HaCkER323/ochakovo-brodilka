    <circle cx="604" cy="626" r="60" fill="#FF6B3D" stroke="#10251A" stroke-width="5"/>
    <circle cx="604" cy="626" r="49" fill="none" stroke="#F3EEDF" stroke-width="2.5" stroke-dasharray="4 6"/>
    <text x="604" y="614" text-anchor="middle" fill="#10251A" font-family="Bahnschrift, Arial Narrow, sans-serif" font-size="20" font-weight="800">ПРИЗ</text>
    <text x="604" y="636" text-anchor="middle" fill="#10251A" font-family="Bahnschrift, Arial Narrow, sans-serif" font-size="13" font-weight="700">ЗА СМЕНУ</text>
    <path d="M584 650c12 5 28 5 40-1" stroke="#10251A" stroke-width="2.5" stroke-linecap="round"/>
