    <path d="M314 648c-6-30 16-54 44-52 28 2 48 28 42 56-5 25-28 40-52 36-22-4-30-19-34-40Z" fill="url(#hcLemon)" stroke="#10251A" stroke-width="5"/>
    <path d="M330 630c8-18 26-28 44-24" stroke="#FFF0A8" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    <path d="M352 600c10-14 26-20 40-14-6 15-20 23-36 20" fill="#7CB342" stroke="#10251A" stroke-width="3"/>
    <path d="M316 664c10-7 18-6 24 2" stroke="#D98A2C" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
