    <clipPath id="hcCanBody">
      <rect x="390" y="300" width="210" height="410" rx="26"/>
    </clipPath>
  </defs>

  <ellipse cx="370" cy="716" rx="286" ry="32" fill="#10251A" opacity="0.16" filter="url(#hcShadow)"/>
  <ellipse cx="370" cy="470" rx="300" ry="300" fill="#D7F35B" opacity="0.1" filter="url(#hcGlow)"/>

  <!-- loose bubbles -->
  <g>
