        <circle r="34" fill="url(#hcLemon)" stroke="#10251A" stroke-width="4"/>
        <circle r="27" fill="#FCEFA8"/>
        <g stroke="#E9A82E" stroke-width="3">
          <path d="M0-24V24M-24 0H24M-17-17 17 17M17-17-17 17"/>
        </g>
        <circle r="34" fill="none" stroke="#10251A" stroke-width="4"/>
      </g>
      <text x="495" y="560" text-anchor="middle" fill="#0C3B28" font-family="Bahnschrift, Arial Narrow, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">ЛИМОН · МЯТА · ПУЗЫРЬКИ</text>
      <text x="495" y="592" text-anchor="middle" fill="#0C3B28" font-family="Bahnschrift, Arial Narrow, sans-serif" font-size="16" font-weight="800" letter-spacing="3">БРОДИЛКА</text>
