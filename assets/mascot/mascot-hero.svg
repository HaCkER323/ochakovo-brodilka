      <ellipse cx="1520" cy="1680" rx="660" ry="580" fill="#7C9C1E" opacity="0.34" filter="url(#mhBlur)"/>
      <ellipse cx="1200" cy="986" rx="450" ry="130" fill="#84A81C" opacity="0.32" filter="url(#mhBlur)"/>
