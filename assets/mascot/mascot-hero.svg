<svg width="2400" height="2400" viewBox="0 0 2400 2400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="mhBody" cx="1030" cy="1020" r="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FFC8"/>
      <stop offset="0.34" stop-color="#D7F35B"/>
      <stop offset="0.68" stop-color="#B8DA3C"/>
      <stop offset="0.88" stop-color="#9DBE28"/>
      <stop offset="1" stop-color="#84A81C"/>
    </radialGradient>
    <linearGradient id="mhCap" x1="760" y1="700" x2="1620" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFA478"/>
      <stop offset="0.42" stop-color="#FF6B3D"/>
      <stop offset="1" stop-color="#D9501F"/>
    </linearGradient>
    <linearGradient id="mhHand" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFDF2"/>
      <stop offset="1" stop-color="#EDE5D1"/>
    </linearGradient>
    <radialGradient id="mhBubbleLime" cx="0.35" cy="0.3" r="0.8">
      <stop stop-color="#F6FFC2" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#D7F35B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9DBE28" stop-opacity="0.42"/>
    </radialGradient>
    <radialGradient id="mhBubbleCream" cx="0.3" cy="0.28" r="0.85">
      <stop stop-color="#FFFDF5" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F3EEDF" stop-opacity="0.18"/>
    </radialGradient>
    <radialGradient id="mhShade" cx="0.3" cy="0.25" r="0.85">
      <stop stop-color="#84A81C" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#84A81C" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#6E8F14" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="mhBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="mhShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="mhSoft" x="-200" y="-200" width="900" height="900" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <clipPath id="mhClip">
      <path d="M1200 660c340 0 610 275 610 660s-270 660-610 660-610-275-610-660 270-660 610-660Z"/>
    </clipPath>
  </defs>

  <!-- soft ground shadow -->
