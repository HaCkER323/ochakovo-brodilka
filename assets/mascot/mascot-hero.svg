        <circle cx="1450" cy="1040" r="11" opacity="0.18"/>
        <circle cx="1560" cy="1750" r="14" opacity="0.16"/>
        <circle cx="960" cy="1720" r="9" opacity="0.16"/>
        <circle cx="1180" cy="1880" r="12" opacity="0.14"/>
        <circle cx="1680" cy="1420" r="8" opacity="0.16"/>
      </g>
    </g>
