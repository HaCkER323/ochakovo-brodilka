    <circle cx="1840" cy="394" r="9" fill="#FFFDF5" opacity="0.85"/>
    <circle cx="1932" cy="512" r="5" fill="#FFFDF5" opacity="0.8"/>
    <!-- small lime bubbles -->
    <g stroke="#10251A">
      <circle cx="296" cy="1612" r="86" fill="url(#mhBubbleLime)" stroke-width="9" opacity="0.9"/>
      <circle cx="2072" cy="1782" r="72" fill="url(#mhBubbleLime)" stroke-width="8" opacity="0.9"/>
      <circle cx="1890" cy="1150" r="44" fill="url(#mhBubbleLime)" stroke-width="7" opacity="0.85"/>
      <circle cx="352" cy="1180" r="30" fill="url(#mhBubbleLime)" stroke-width="6" opacity="0.8"/>
