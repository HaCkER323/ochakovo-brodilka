    <ellipse cx="470" cy="820" rx="36" ry="27" fill="url(#mhHand)" stroke="#10251A" stroke-width="16" transform="rotate(-30 470 820)"/>
    <path d="M352 722c16-18 40-28 64-26" stroke="#FFFDF5" stroke-width="13" stroke-linecap="round" opacity="0.9"/>
