    <ellipse cx="1086" cy="1362" rx="44" ry="60" fill="#10251A"/>
    <ellipse cx="1440" cy="1352" rx="52" ry="66" fill="#10251A"/>
    <circle cx="1100" cy="1338" r="14" fill="#FFFDF5"/>
    <circle cx="1456" cy="1326" r="17" fill="#FFFDF5"/>
    <circle cx="1080" cy="1386" r="5" fill="#FFFDF5" opacity="0.55"/>
    <circle cx="1428" cy="1382" r="6" fill="#FFFDF5" opacity="0.5"/>
