    <!-- sparkles -->
    <g fill="#FFFDF5" opacity="0.9">
      <path d="M2140 500l14 34 34 14-34 14-14 34-14-34-34-14 34-14 14-34Z"/>
      <path d="M300 980l10 24 24 10-24 10-10 24-10-24-24-10 24-10 10-24Z"/>
