      <circle cx="1938" cy="520" r="20" fill="#FF6B3D" stroke-width="6"/>
      <circle cx="1722" cy="314" r="14" fill="#FF6B3D" stroke-width="5"/>
      <circle cx="530" cy="1748" r="18" fill="#FF6B3D" stroke-width="5"/>
      <circle cx="2050" cy="1120" r="12" fill="#FF6B3D" stroke-width="4"/>
