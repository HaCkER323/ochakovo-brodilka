    <path d="M244 1562c14-22 34-38 58-46" stroke="#FFFDF5" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
    <path d="M2036 1738c10-18 26-30 44-36" stroke="#FFFDF5" stroke-width="9" stroke-linecap="round" opacity="0.7"/>
