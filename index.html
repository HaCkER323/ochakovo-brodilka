<!DOCTYPE html>
<html lang="ru" data-design="brand">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#D50032" id="themeColor">
  <meta name="color-scheme" content="light">
  <meta name="description" content="БРОДИЛКА: квест Очаково о первой смене на заводе кваса, лимонадов и воды. Выбери героя, пройди смену и получи билет в розыгрыш.">
  <meta name="application-name" content="БРОДИЛКА">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="БРОДИЛКА">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    (function () {
      var design = "brand";
      try {
        var saved = window.localStorage.getItem("ochakovo-brodilka-design");
        if (saved === "brodilka" || saved === "brand") design = saved;
      } catch (error) {
        /* localStorage может быть недоступен */
      }
      document.documentElement.setAttribute("data-design", design);
      var theme = document.getElementById("themeColor");
      if (theme) theme.setAttribute("content", design === "brodilka" ? "#0C3B28" : "#D50032");
    })();
  </script>
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:title" content="БРОДИЛКА: квест о первой смене на Очаково">
  <meta property="og:description" content="Три смены, три характера, один завод: квас, лимонады и вода. Выбери героя, пройди квест и получи билет в розыгрыш.">
  <title>БРОДИЛКА: квест о первой смене на Очаково</title>
  <link rel="icon" type="image/svg+xml" href="assets/app-icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/brand.css">
</head>
<body>
  <a class="skip-link" href="#app">Перейти к игре</a>
  <div class="grain" aria-hidden="true"></div>

  <header class="site-head">
    <button class="brand" type="button" data-action="home" aria-label="БРОДИЛКА, на главную">
      <img class="brand-mark" src="assets/brand/ochakovo-mark.svg" alt="" width="32" height="32">
      <img class="brand-logo" src="assets/brand/ochakovo-logo.png" alt="">
      <span class="brand-ochakovo">ОЧАКОВО</span>
      <span class="brand-sep" aria-hidden="true"></span>
      <span class="brand-project">БРОДИЛКА<sup>®</sup></span>
    </button>

    <div class="head-status" id="headStatus" aria-live="polite"></div>

    <div class="head-right">
      <button class="install-btn" id="installApp" type="button" aria-label="Установить приложение БРОДИЛКА" hidden>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5M5 20h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="install-label">Установить</span>
      </button>
      <button class="sound-btn" id="soundToggle" type="button" aria-label="Выключить звук" aria-pressed="true">
        <svg class="sound-on" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M16 9c1.3 1.7 1.3 4.3 0 6M18.5 6.5c2.7 3 2.7 8 0 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <svg class="sound-off" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="m16 10 5 5M21 10l-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <div class="sr-only" id="srStatus" role="status" aria-live="polite" aria-atomic="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div id="modalRoot"></div>

  <noscript>
    <div class="noscript">Для игры нужен JavaScript. Включи его, и добро пожаловать на завод.</div>
  </noscript>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
